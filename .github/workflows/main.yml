name: Generate Signing Key
on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore mykey.jks \
            -alias mykey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=mykey, OU=mykey, O=mykey, L=mykey, S=mykey, C=US" \
            -storepass mypassword \
            -keypass mypassword
          base64 -w 0 mykey.jks
